[platformio]
default_envs = bench

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:bench]
build_flags = ${env.build_flags} -D TG_SIMULATED=1

[env:sensor]
build_flags = ${env.build_flags} -D TG_SIMULATED=0
